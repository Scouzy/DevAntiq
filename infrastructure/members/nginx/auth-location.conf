# In each protected HTTPS application server.
location = /internal/devantiq-auth {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:9092/internal/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host devantiq.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Original-URL https://$host$request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
