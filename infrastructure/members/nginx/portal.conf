# Include only in the HTTPS server devantiq.com.
location = /auth { return 302 /auth/; }
location ^~ /auth/static/ {
    alias /opt/devantiq-members/static/;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /auth/ {
    if ($host != devantiq.com) { return 308 https://devantiq.com$request_uri; }
    proxy_pass http://127.0.0.1:9092;
    proxy_set_header Host devantiq.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    add_header Cache-Control 'no-store' always;
}
location = /api/member-session {
    proxy_pass http://127.0.0.1:9092;
    proxy_set_header Host devantiq.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache off;
    add_header Cache-Control 'no-store' always;
}
location = /membres.html {
    if ($host != devantiq.com) { return 308 https://devantiq.com$request_uri; }
    add_header Cache-Control 'no-store' always;
    try_files $uri =404;
}
